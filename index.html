<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#090d16">
    <title>Word Swipe | Daily Puzzle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>

    <div class="app-container">
        <div class="ambient-orb orb-1" aria-hidden="true"></div>
        <div class="ambient-orb orb-2" aria-hidden="true"></div>

        <!-- [SCREEN 01: START] -->
        <div id="start-screen" class="screen active">
            <div class="start-content">
                <div class="logo-emblem">
                    <i class="fa-solid fa-spell-check logo-icon"></i>
                </div>
                <span class="mode-tag" id="mode-badge">DAILY PUZZLE</span>
                <h1>Parole<br>Collegate</h1>
                <p>Collega le lettere e trova le <strong id="start-total">...</strong> parole principali del giorno.</p>

                <div class="puzzle-id-badge">
                    <i class="fa-solid fa-hashtag"></i> Livello <span id="level-id-display">...</span>
                </div>

                <div class="rules-mini">
                    <span><i class="fa-solid fa-bolt"></i> Parole extra = <strong>+5s Bonus</strong></span>
                    <span><i class="fa-solid fa-lightbulb"></i> <strong>3 Aiuti</strong> disponibili</span>
                </div>

                <button id="btn-start" class="btn-primary" disabled>Caricamento...</button>
            </div>
        </div>

        <!-- [SCREEN 02: GAMEPLAY] -->
        <div id="game-screen" class="screen">
            <header class="game-header">
                <div class="top-bar">
                    <div class="badge timer-badge" id="timer-badge">
                        <i class="fa-regular fa-clock"></i>
                        <span id="timer-display">03:00</span>
                    </div>

                    <div class="stars-container" id="stars-display">
                        <i class="fa-solid fa-star star" id="star-1"></i>
                        <i class="fa-solid fa-star star" id="star-2"></i>
                        <i class="fa-solid fa-star star" id="star-3"></i>
                    </div>

                    <div class="badge progress-badge">
                        <i class="fa-solid fa-check-double"></i>
                        <span><span id="words-found">0</span>/<span id="words-total">0</span></span>
                    </div>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progress-bar"></div>
                </div>
            </header>

            <div class="words-wrapper">
                <div class="words-grid" id="words-grid"></div>
            </div>

            <div class="feedback-bar">
                <div id="toast-pill" class="toast-pill"></div>
                <div class="current-word">
                    <span id="word-display"></span>
                </div>
            </div>

            <div class="board-area" id="board-area">
                <!-- Left Action: Bonus Words Info & Counter -->
                <button type="button" class="board-action-pill bonus-pill" id="bonus-box" data-tooltip="Trova parole extra valide per guadagnare +5 secondi!">
                    <div class="pill-icon-wrap">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                        <span class="pill-count" id="bonus-count">0</span>
                    </div>
                    <span class="pill-label">BONUS +5s</span>
                </button>

                <!-- Center Wheel -->
                <div class="circle-board" id="board">
                    <canvas id="swipe-canvas"></canvas>
                    <button type="button" id="btn-shuffle" class="shuffle-btn" title="Mescola lettere (Spazio)" aria-label="Mescola lettere">
                        <i class="fa-solid fa-shuffle"></i>
                    </button>
                </div>

                <!-- Right Action: Reveal Letter Hint -->
                <button type="button" id="btn-hint" class="board-action-pill hint-pill" data-tooltip="Rivela una lettera casuale nella griglia in alto">
                    <div class="pill-icon-wrap">
                        <i class="fa-solid fa-lightbulb"></i>
                        <span class="pill-count" id="hint-count">3</span>
                    </div>
                    <span class="pill-label">AIUTO</span>
                </button>
            </div>
        </div>

        <!-- [SCREEN 03: SUMMARY] -->
        <div id="end-screen" class="screen">
            <div class="end-content">
                <span class="mode-tag" id="end-level-tag">LIVELLO COMPLETATO</span>
                <h2 id="end-title">Ottimo Lavoro!</h2>

                <!-- Stars & Numeric Score Box -->
                <div class="candy-stars" id="final-stars">
                    <i class="fa-solid fa-star candy-star"></i>
                    <i class="fa-solid fa-star candy-star"></i>
                    <i class="fa-solid fa-star candy-star"></i>
                </div>

                <div class="score-summary-bar">
                    <div class="score-chip">
                        <span class="score-chip-label">STELLE</span>
                        <strong id="score-stars-val">0/3</strong>
                    </div>
                    <div class="score-chip">
                        <span class="score-chip-label">PAROLE</span>
                        <strong id="score-words-val">0/0</strong>
                    </div>
                    <div class="score-chip">
                        <span class="score-chip-label">BONUS</span>
                        <strong id="score-bonus-val">0</strong>
                    </div>
                </div>

                <p id="end-subtitle"></p>

                <div id="final-words-list" class="final-words-list"></div>

                <div class="end-actions">
                    <button id="btn-play-random" class="btn-primary btn-practice">
                        <i class="fa-solid fa-rotate-right"></i> Gioca Livello Extra
                    </button>
                </div>

                <div class="divider"></div>
                <p class="small-text">Un nuovo puzzle giornaliero ti aspetta ogni mezzanotte.</p>
            </div>
        </div>
    </div>

    <script src="js/script.js?v=4"></script>
</body>
</html>
