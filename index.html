<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Word Swipe | Daily Puzzle</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <div class="app-container">
        
        <!-- SCHERMATA 1: INIZIO -->
        <div id="start-screen" class="screen active">
            <div class="start-content">
                <i class="fa-solid fa-shapes logo-icon"></i>
                <h1>Parole<br>Collegate</h1>
                <p>Trova le <span id="start-total">...</span> parole nascoste.</p>
                <div class="puzzle-id-badge">Livello #<span id="level-id-display">...</span></div>
                <button id="btn-start" class="btn-primary" disabled>Caricamento DB...</button>
            </div>
        </div>

        <!-- SCHERMATA 2: GIOCO -->
        <div id="game-screen" class="screen">
            
            <!-- NUOVO HEADER PULITO -->
            <header class="game-header">
                <div class="top-bar">
                    <!-- Pillola Timer -->
                    <div class="badge timer-badge">
                        <i class="fa-regular fa-clock"></i>
                        <span id="timer-display">03:00</span>
                    </div>
                    
                    <!-- Stelle Centrali -->
                    <div class="stars-container" id="stars-display">
                        <i class="fa-solid fa-star star" id="star-1"></i>
                        <i class="fa-solid fa-star star" id="star-2"></i>
                        <i class="fa-solid fa-star star" id="star-3"></i>
                    </div>

                    <!-- Pillola Contatore Parole -->
                    <div class="badge progress-badge">
                        <i class="fa-solid fa-check-double"></i>
                        <span><span id="words-found">0</span>/<span id="words-total">0</span></span>
                    </div>
                </div>
                <!-- Barra di avanzamento sottile -->
                <div class="progress-track">
                    <div class="progress-fill" id="progress-bar"></div>
                </div>
            </header>

            <!-- CONTENITORE PAROLE FLUIDO -->
            <div class="words-wrapper">
                <div class="words-grid" id="words-grid"></div>
            </div>

            <div class="current-word">
                <span id="word-display"></span>
            </div>
            
            <div class="board-area">
                <div class="circle-board" id="board">
                    <canvas id="swipe-canvas"></canvas>
                    <button id="btn-shuffle" class="shuffle-btn"><i class="fa-solid fa-shuffle"></i></button>
                </div>
            </div>
        </div>

        <!-- SCHERMATA 3: FINE GIOCO -->
        <div id="end-screen" class="screen">
            <div class="end-content">
                <h2 id="end-title">Tempo Scaduto!</h2>
                <div class="candy-stars" id="final-stars"></div>
                <p id="end-subtitle"></p>
                <div class="divider"></div>
                <h3>Torna domani!</h3>
                <p class="small-text">Un nuovo puzzle casuale ti aspetta a mezzanotte.</p>
            </div>
        </div>

    </div>

    <script src="js/script.js"></script>
</body>
</html>
